; Better Third-Person Selection - settings. The values here are the compiled defaults; the in-game page (Apocrypha Menu Framework >
; Better Third-Person Selection) changes them and saves here.

[General]
; 1 = use what you are roughly looking at, not only what the crosshair is exactly on
bEnabled=1
bThirdPerson=1
; first person keeps the game's own precise pick unless this is 1
bFirstPerson=0
; how far from your character, in game units (about 70 to a metre): 50 to 600
fRange=200.0
; how far to either side of where the camera looks, in degrees: 5 to 90
fMaxAngle=60.0

[Test]
; where the choice is handed to the game: 0 = nowhere (observe and log only), 1 pickRef, 2 reticleRef, 3 crosshairRef,
; 4 activateRef (the game's own prompt target), 5 all four.
iApplyTo=4
; 1 = one log line whenever the game's pick or this mod's choice changes
bLogTargets=1

[Log]
; 0 trace, 1 debug, 2 info, 3 warn, 4 error, 5 critical, 6 off
uLogLevel=2
